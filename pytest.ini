[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --cov=app
    --cov-report=html
    --cov-report=term-missing
markers =
    unit: Unit tests
    integration: Integration tests
    auth: Authentication tests
    devices: Device management tests
    configurations: Configuration tests
    backup: Backup jobs tests
    dashboard: Dashboard overview tests
    automation: Automation workflow tests
    change_management: Change management tests
